# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=smallshop;encrypt=false
spring.datasource.username=sa
spring.datasource.password=12345678x@X
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate (dialect is auto-detected; explicit setting kept for clarity)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Preserve entity field/table names verbatim (don't snake_case) — matches the existing DB schema.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true

# Redis cache
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.cache-names=rediscache
